name: CI

# 主干推送 / PR 时跑离屏冒烟测试。
#
# ⚠️ 已知限制:GitHub-hosted 的 Windows runner 运行在 Session 0(无交互桌面),
#    import PySide6 / 创建 QApplication 会原生崩溃(进程在 Python 异常处理前
#    被杀,本地完全无法复现)。因此 smoke job 设 continue-on-error:失败不阻塞
#    CI 状态。请用本地验证:
#      QT_QPA_PLATFORM=offscreen python tests/test_smoke_offscreen.py
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke:
    runs-on: windows-latest
    continue-on-error: true   # Session 0 跑不了 Qt,失败不阻塞;本地可通过
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 离屏冒烟测试
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/test_smoke_offscreen.py
