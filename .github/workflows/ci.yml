name: CI

# 主干推送 / PR 时跑离屏冒烟测试,确保 UI 能正常构建、不回归。
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 离屏冒烟测试(CI 友好,不实际注册热键)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/test_smoke_offscreen.py
